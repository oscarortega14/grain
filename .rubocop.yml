AllCops:
  TargetRubyVersion: 3.2
  # Files the generators write while under test are output, not source. Excluded
  # wholesale so the linter never grades Grain on generated Ruby.
  Exclude:
    - "test/tmp/**/*"
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Schema definitions and database round trips do not decompose into ten-line
# methods without becoming harder to read, which is the opposite of the point.
Metrics:
  Exclude:
    - "test/**/*"

# A rake namespace is one block by construction; splitting it to satisfy a line
# count would scatter related tasks across files.
Metrics/BlockLength:
  Exclude:
    - "lib/tasks/*.rake"
    # A gemspec is one block by definition.
    - "*.gemspec"
